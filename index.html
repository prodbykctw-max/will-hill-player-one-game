<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0810" />
  <!-- Added-to-home-screen behaviour. Without these iOS opens the shortcut in
       a Safari shell with browser chrome over the board; with them it runs
       standalone, which is what a game wants. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- THE HOME-SCREEN LABEL. iOS reads this, Android reads the manifest's
       short_name, and both are set to "Will Hill" — the artist's name is the
       point of the project, and an icon captioned "Player One" loses it.
       Flip both together if that is ever wanted the other way round. -->
  <meta name="apple-mobile-web-app-title" content="Will Hill" />
  <!-- THE APP ICON IS WILL HILL'S OWN HUD PORTRAIT — the head crop the game
       draws top-left, cut from the same spritesheet by tools/make_icons.py so
       the two can never drift apart. Paths are RELATIVE and unhashed: the
       build's base is './' so this works under a project subpath on Pages,
       and an installed app's icon is cached by URL, so a content hash that
       moved on every deploy would leave home screens pointing at a 404.
       iOS ignores the manifest's icons entirely and needs apple-touch-icon. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <!-- Never cache the HTML. Every real asset Vite emits is content-hashed and
       can be cached forever, so this document is the ONLY thing that can go
       stale — and when it does, a home-screen install keeps launching an old
       build long after a deploy has landed. That is exactly how a shipped
       sprite fix appeared not to have shipped. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Will Hill: Player One</title>
  <style>
    html, body {
      margin: 0; padding: 0; background: #0a0810; height: 100%;
      overflow: hidden;
      /* a game canvas should never rubber-band or text-select under a thumb */
      overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      /* No browser zoom anywhere on the page. `manipulation` still leaves
         iOS pairing taps across two different elements — which is what
         working the left/right pads does — so this is `none`, and the page
         does not scroll anyway (overflow is hidden). src/core/input.js
         covers the routes CSS cannot: paired taps, WebKit gesture events,
         and ctrl+wheel. */
      touch-action: none;
    }
    /* Stronger still on the board itself: no double-tap, no pinch, no pan. */
    #game {
      display: block; width: 100vw; image-rendering: pixelated;
      touch-action: none;
      /* ⚠️ NOT 100vh ALONE. On iOS Safari `vh` is anchored to the LARGE
         viewport (address bar + toolbar collapsed) — real screenshot from the
         client showed PRESS START up but OPTIONS/MUSIC gone, on a device with
         BOTH Safari bars visible at once. `overflow:hidden` on <body> above
         means nothing can scroll to reveal the shortfall, so the extra height
         `vh` claims but the screen doesn't have just clips off the bottom of
         the card — exactly where OPTIONS/MUSIC draw. `dvh` tracks the bars
         actually showing; `vh` stays first as the fallback for browsers that
         don't know `dvh` (CSS ignores a property it can't parse and keeps the
         last one it understood). */
      height: 100vh; height: 100dvh;
    }

    /* ── ON-SCREEN CONTROLS ───────────────────────────────────────────
       Hidden by default and switched on by src/core/input.js only when a
       touch device is detected, so desktop keeps a clean frame. Laid out
       against the safe-area inset because a portrait phone's home
       indicator sits exactly where a jump button wants to be. */
    /* CONTROLS ARE OPT-IN, AND HIDDEN UNTIL THE GAME SAYS OTHERWISE.
       This was the other way round — shown on any touch device and switched
       OFF per screen — and it flashed the four pads over the title card for
       the moment between input.js detecting touch and the first update()
       tick, because until the loop has run once nothing has told them to
       hide. Requiring BOTH classes means there is no window in which they can
       appear by default: the pads exist only while `playing` is set, which
       main.js does from the game state, and never during the boot, the title,
       the MARTA ride between stages, or the results board. */
    #touch { display: none; }
    body.touch.playing #touch { display: block; }

    #touch .pad {
      position: fixed; z-index: 10;
      box-sizing: border-box;   /* so the widths below ARE the hit widths */
      display: flex; align-items: center; justify-content: center;
      font: 700 15px/1 system-ui, sans-serif; letter-spacing: 0.06em;
      color: rgba(255,255,255,0.82);
      background: rgba(18,14,28,0.42);
      border: 2px solid rgba(255,214,110,0.34);
      border-radius: 16px;
      touch-action: none;
      /* NO backdrop-filter. It was blur(3px) — invisible over this art, and
         not free: a backdrop filter on four fixed elements sitting over a
         canvas that repaints every frame makes the compositor re-sample the
         backdrop every frame too, for all four.

         RELEASE fades, PRESS does not. The transition used to run 60ms in
         BOTH directions, so the button lit up a full sixteenth of a second
         after the thumb landed — the input had already registered and the
         control still looked late, which is most of what "stiff" is. Lighting
         up on the same frame as the touch is the entire point of the
         highlight. Coming back down can take its time. */
      /* ── THEY LOOK LIKE BUTTONS NOW ─────────────────────────────────
         Client: "make them look more like you're pressing them instead of
         just flatscreen — raise them and make them actual buttons."
         A flat translucent square gives the eye nothing to read as depth, so
         a press could only be shown by a colour change, which is exactly the
         thing that felt late.
         Three cheap cues, all of them free (no filters, no extra layers):
         a top-lit gradient so the face reads as domed, an inset white
         highlight along the top edge and an inset dark line along the
         bottom, and a drop shadow underneath that the button sits on.
         Pressing collapses all three at once — the shadow shrinks, the
         highlight and the shade swap ends, and it translates down 2px, which
         is what "pressed" looks like on a real key. */
      background:
        linear-gradient(180deg, rgba(255,255,255,0.13) 0%,
                                rgba(255,255,255,0.03) 42%,
                                rgba(0,0,0,0.16) 100%),
        rgba(18,14,28,0.52);
      box-shadow:
        inset 0 1.5px 0 rgba(255,255,255,0.34),
        inset 0 -2px 0 rgba(0,0,0,0.42),
        0 4px 0 rgba(0,0,0,0.34),
        0 6px 10px rgba(0,0,0,0.34);
      text-shadow: 0 1px 0 rgba(0,0,0,0.55);
      transition: background 90ms linear, border-color 90ms linear,
                  transform 90ms linear, box-shadow 90ms linear;
    }
    /* PRESS IS INSTANT, RELEASE FADES — the highlight has to land on the same
       frame as the touch or the control reads as late, which is most of what
       "stiff" was. Coming back up can take its time. */
    #touch .pad.on {
      background:
        linear-gradient(180deg, rgba(0,0,0,0.20) 0%,
                                rgba(255,214,110,0.20) 60%,
                                rgba(255,214,110,0.34) 100%),
        rgba(255,214,110,0.22);
      border-color: rgba(255,214,110,0.85);
      transform: translateY(2px) scale(0.97);
      box-shadow:
        inset 0 2px 3px rgba(0,0,0,0.45),
        inset 0 -1px 0 rgba(255,255,255,0.16),
        0 1px 0 rgba(0,0,0,0.30);
      transition: none;
    }

    /* left cluster: move. right cluster: jump + dash.
       The movement pads sit 4px apart rather than the old 6-10px, and
       src/core/input.js hit-tests them with 26px of slop, so the seam
       between ◀ and ▶ belongs to whichever is nearer instead of being a
       dead strip your thumb can rest in and stop the character. */
    /* SIZED DOWN ~15%: 82 -> 70, 96 -> 82, 74 -> 64. The 4px seam between the
       movement pads is kept and input.js still hit-tests them with 26px of
       slop, so the REACHABLE area barely changes even though the drawn button
       is smaller — which is the point of shrinking them. */
    /* ── THE MOVEMENT PAIR SITS HIGHER, AND READS SOLIDER ────────────────
       Client: "the left and right buttons need to come up slightly, the ones
       at the bottom left of the screen... and I want them to appear a little
       more solid."
       Only this pair. JUMP and DASH keep their own height and their own
       translucency — he named the navigation buttons specifically, and these
       are the two that sit over the busiest part of the plate (the kerb and
       the wet street), which is why they were the ones washing out.
       18 -> 34px of lift. src/core/input.js hit-tests off
       getBoundingClientRect, so the touch targets travel with them and the
       26px of slop between ◀ and ▶ is untouched. */
    #tL, #tR { bottom: calc(34px + env(safe-area-inset-bottom, 0px)); width: 70px; height: 70px; }
    #tL { left: calc(16px + env(safe-area-inset-left, 0px)); }
    #tR { left: calc(90px + env(safe-area-inset-left, 0px)); }
    /* ⚠️ `:not(.on)`, and it is doing real work. `#touch .pad.on` is one id
       and two classes; a plain `#tL, #tR` is one id and NO class, so the base
       `#touch .pad` would out-rank it and none of this would apply — while
       `#touch #tL` would out-rank the PRESSED state and the buttons would
       stop lighting up under a thumb. Scoping to the unpressed state sits
       clear of both and cannot fight the press. */
    #touch .pad.move:not(.on) {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.16) 0%,
                                rgba(255,255,255,0.04) 42%,
                                rgba(0,0,0,0.20) 100%),
        rgba(18,14,28,0.80);
      border-color: rgba(255,214,110,0.58);
      color: rgba(255,255,255,0.96);
    }

    #tJump, #tDash { right: calc(16px + env(safe-area-inset-right, 0px)); }
    #tJump {
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      width: 82px; height: 82px; border-radius: 50%;
      border-color: rgba(120,220,255,0.45);
      background: rgba(30,60,90,0.42);
    }
    #tJump.on { background: rgba(120,220,255,0.32); border-color: rgba(120,220,255,0.85); }
    #tDash {
      bottom: calc(114px + env(safe-area-inset-bottom, 0px));
      width: 64px; height: 64px; border-radius: 50%;
      font-size: 13px;
    }

    /* ── PANEL ────────────────────────────────────────────────────────
       Leaderboard, contest sign-up and settings. `hidden` on the element is
       what closes it, so there is no open-but-invisible state to leak. */
    #panel {
      position: fixed; inset: 0; z-index: 30;
      /* ⚠️ align-items MUST NOT BE `center` HERE — see #panelCard's margin.
         This is a scroll container, and a CENTRED flex item that grows taller
         than its container overflows EQUALLY in both directions. The bottom
         half is reachable; the top half is not, because scrollTop cannot go
         negative. That is the whole of "the leaderboard is cut off at the
         top": his MARTA card is taller than a phone, so the head of it —
         the marta wordmark and ATL 404 — sat above the scroll origin with no
         way to reach it. `flex-start` plus an auto margin still centres the
         card whenever there IS room, and keeps the top reachable when there
         is not. */
      display: flex; align-items: flex-start; justify-content: center;
      background: rgba(6,5,10,0.82);
      padding: calc(14px + env(safe-area-inset-top, 0px)) 14px
               calc(14px + env(safe-area-inset-bottom, 0px));
      /* The panel scrolls, the page never does — on a short phone with the
         keyboard up the form is taller than what is left of the screen. */
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      /* Client: "it scrolls within itself a little bit without a scroll bar."
         The bar is chrome over his artwork and the card is plainly a card —
         it reads as scrollable without being told. */
      scrollbar-width: none;
    }
    #panel::-webkit-scrollbar { width: 0; height: 0; display: none; }
    #panel[hidden] { display: none; }
    #panelCard {
      /* Centres in both axes when the card fits, and degrades to top-aligned
         — scrollable all the way up — when it does not. Doing the centring
         from the ITEM instead of the container is what keeps the overflow
         symmetrical-but-reachable rather than unreachable. */
      margin: auto;
      position: relative; width: 100%; max-width: 420px;
      box-sizing: border-box; padding: 18px 18px 16px;
      background: #12101c;
      border: 2px solid rgba(255,214,110,0.40); border-radius: 14px;
      color: #f2ead8; font: 400 15px/1.45 system-ui, sans-serif;
      box-shadow: 0 18px 60px rgba(0,0,0,0.6);
    }
    /* ── THE BOARD VIEW HAS NO PANEL ──────────────────────────────────
       Client, yellow marker drawn right round the outside of the panel:
       "that's a piece of art... I don't need it to be like leaderboard inside
       of an empty space inside of a square, I need that whole area to be the
       leaderboard."
       So on this one view the panel stops being furniture. No plate, no
       border, no padding, no shadow and no external heading — the ticket is
       lettered LEADERBOARD already. Whatever the artwork's own aspect ratio
       does not cover shows the dimmed game behind it rather than a dark box,
       because a box is the thing he is objecting to. */
    /* ⚠️ `width: 100%`, NEVER `width: auto`. This shipped as `auto` and the
       whole board came up BLANK on his iPhone — nothing but the ✕, sitting
       near the middle of the screen, which is the tell: the card had collapsed
       to zero width and its top-right corner was the centre.
       The cause is a circular sizing chain. `#lbCard` takes its WIDTH from its
       height through `aspect-ratio`; `width: auto` on the parent then asks the
       parent to size itself from that child. Chrome resolves it, Safari gives
       up and returns zero. A definite width breaks the circle — the panel is
       transparent here anyway, so filling the frame costs nothing and the
       artwork still centres itself inside it. */
    #panelCard.bare {
      background: none; border: 0; box-shadow: none;
      padding: 0; max-width: none; width: 100%;
    }
    #panelCard.bare #panelClose {
      top: 2px; right: 2px;
      /* Over artwork now rather than over a dark plate, so it needs its own
         contrast instead of borrowing the panel's. */
      color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    #panelTitle {
      margin: 0 0 12px; font: 800 20px/1 system-ui, sans-serif;
      letter-spacing: 0.08em; color: #ffd66e;
    }
    #panelTitle[hidden] { display: none; }
    #panelClose {
      position: absolute; top: 8px; right: 8px; width: 38px; height: 38px;
      background: none; border: 0; color: rgba(242,234,216,0.6);
      font-size: 19px; cursor: pointer;
    }
    /* Two across: the wrong way and the right way, side by side, so the
       pair reads as one lesson without a word of explanation. */
    /* The ticket's cream footer, used as the action bar. Positioned in card
       fractions like the score rows, so it tracks the artwork at any size —
       the dark body ends at 0.857 and the cream runs to 0.946. */
    #lbActions {
      position: absolute; left: 6%; right: 6%;
      top: 86.4%; height: 7.4%;
      display: flex; align-items: stretch;
    }
    #lbActions .btn.card {
      flex: 1; margin: 0; padding: 0;
      display: flex; align-items: center; justify-content: center;
      font: 800 3.5cqw/1 system-ui, sans-serif; letter-spacing: 0.06em;
      color: #f7f1e2; background: #16131f;
      border: 0.5cqw solid rgba(255,214,110,0.75); border-radius: 2cqw;
      box-shadow: 0 0.6cqw 0 rgba(0,0,0,0.45);
      cursor: pointer;
    }
    #lbActions .btn.card:active { transform: translateY(0.3cqw); box-shadow: none; }
    #lbActions .btn.card[hidden] { display: none; }

    #howList {
      margin: 0 0 14px; padding: 0; list-style: none;
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    #howList li {
      position: relative; margin: 0; border-radius: 8px; overflow: hidden;
      border: 2px solid rgba(255,214,110,0.28);
      background: #0b0912; line-height: 0;
    }
    #howList .howShot { display: block; width: 100%; height: auto; }
    /* The verdict sits ON the picture, bottom-left, where it cannot be
       mistaken for belonging to the panel next door. */
    #howList .mark {
      position: absolute; left: 6px; bottom: 5px;
      font: 800 20px/1 system-ui, sans-serif;
      text-shadow: 0 0 4px #000, 0 2px 3px #000;
    }
    #howList .bad { color: #ff5f52; }
    #howList .good { color: #57e08a; }
    #panel .note { margin: 10px 0; font-size: 13px; color: rgba(242,234,216,0.72); }
    #panel .note b { color: #ffd66e; font-weight: 700; }
    #panel .err { margin: 8px 0 0; font-size: 13px; color: #ff8f7a; }
    #panel label {
      display: block; margin: 12px 0 0;
      font: 700 12px/1 system-ui, sans-serif; letter-spacing: 0.07em;
      color: rgba(242,234,216,0.75);
    }
    #panel label .sub {
      font-weight: 400; letter-spacing: 0; text-transform: none;
      color: rgba(242,234,216,0.42);
    }
    #panel label .req {
      font-weight: 700; letter-spacing: 0; text-transform: none;
      color: rgba(255,143,122,0.85);
    }
    /* The in-field helper is the line the player can still see once the
       keyboard has pushed the label off screen, so it has to stay legible
       rather than fade to furniture. */
    #panel ::placeholder { color: rgba(242,234,216,0.38); opacity: 1; }
    #panel input.bad { border-color: rgba(255,143,122,0.85); }
    #panel input[type=text], #panel input[type=tel], #panel input[type=email],
    #panel select {
      display: block; width: 100%; box-sizing: border-box; margin-top: 6px;
      padding: 11px 12px;
      /* 16px minimum, or iOS zooms the whole page in when the field focuses. */
      font: 400 16px/1.2 system-ui, sans-serif;
      color: #f2ead8; background: #0b0913;
      border: 1px solid rgba(255,214,110,0.28); border-radius: 9px;
    }
    #panel input:focus, #panel select:focus {
      outline: none; border-color: rgba(255,214,110,0.75);
    }
    #panel label.row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-top: 16px;
    }
    #panel label.row select { width: auto; margin-top: 0; }
    #panel label.row input[type=checkbox] { width: 22px; height: 22px; accent-color: #ffd66e; }
    #panel .btn {
      display: block; width: 100%; margin-top: 12px; padding: 13px;
      font: 800 14px/1 system-ui, sans-serif; letter-spacing: 0.08em;
      color: #1a1408; background: #ffd66e;
      border: 0; border-radius: 10px; cursor: pointer;
    }
    #panel .btn.ghost {
      color: rgba(242,234,216,0.82); background: none;
      border: 1px solid rgba(255,214,110,0.32);
    }
    /* ── THE BOARD, ON HIS MARTA CARD ──────────────────────────────────
       The leaderboard is his breeze-card design and the rows are laid over
       it, not drawn next to it. Everything here is a FRACTION of the card,
       measured off the artwork itself (852x1846) and listed in the commit
       that blanked its placeholder rows, so the layout survives the card
       being shown at any width.

         rank column   left edge   0.127
         player        left edge   0.286
         score         RIGHT edge  0.880
         row centres   0.5612  0.6077  0.6528  0.6972  0.7405
         your rank     0.8240

       Aspect-ratio holds the box to the card's shape, so a percentage top
       lands on the row it was measured against on any screen. Font size is
       in cqw — container-query width — for the same reason: the lettering
       has to scale WITH the card, and vw would scale with the window
       instead and drift off the rows on a wide one. */
    #lbCard {
      /* ⚠️ SIZED BY HEIGHT, NOT WIDTH — that is what stops the scrolling.
         Client: "change the UX so no scroll needed."
         At width:100% his card is 852x1846, so on a 430px phone it came out
         ~849px tall before the title, the note and the buttons were added —
         taller than the screen, every time, on every phone. Driving the
         HEIGHT from what is left of the viewport and letting aspect-ratio
         derive the width means the whole card is always on screen; on a tall
         phone it still reaches its natural size and the cap never engages.
         100dvh, not 100vh, because Safari's toolbars are exactly the pixels
         being fought over. The reserve is MEASURED, not guessed: 268 left the
         card 17px over on a 430x932 phone, so it is 300 — and the note can
         wrap to two lines when a share result comes back, which is where the
         extra headroom goes. 300 was right while ENTER and BACK were both
         stacked below; with the action moved onto the ticket only the title,
         the note and BACK are left outside, so the reserve is 196 and the
         card takes the difference. */
      position: relative; aspect-ratio: 852 / 1846;
      /* ⚠️ THE RESERVE IS NOW ZERO, because nothing is stacked outside the
         card any more. It was 300 when a note, ENTER and BACK sat below the
         artwork, then 196 when ENTER moved onto the ticket's own footer. With
         the heading hidden, the note moved onto the ticket and BACK sharing
         the footer, there is nothing left outside it to reserve for — so the
         artwork takes the entire panel. Measured on a 430x932 phone: 259px
         wide before, 336px after, and full-height instead of 561px.
         The one thing this CANNOT do is fill the last sliver left and right.
         The ticket is 852x1846 — aspect 0.462 — and the frame it sits in is
         nearer 0.55, so covering it edge to edge means cropping his artwork,
         which is not a thing to do to solve a layout problem. Any remaining
         gap shows the dimmed game, never a plate. If he wants it truly
         edge-to-edge the ticket needs re-rendering at the frame's shape. */
      /* The reserve is only the PANEL'S OWN padding now — 14px top and bottom
         plus whatever the notch and home indicator take. Forgetting it made
         the card exactly 28px too tall and put the scrollbar straight back. */
      height: min(calc(100dvh - 28px - env(safe-area-inset-top, 0px)
                       - env(safe-area-inset-bottom, 0px)), 1846px);
      width: auto; max-width: 100%; margin: 0 auto;
      container-type: inline-size;
      background: center/100% 100% no-repeat;   /* image set in panel.js */
      border-radius: 14px; overflow: hidden;
    }
    /* The note used to sit under the card and cost it height. It lives on the
       ticket now, in the dark band just above the cream footer. */
    /* ⚠️ IN THE GAP BELOW `YOUR RANK`, NOT ON IT. At 79.4% it landed on the
       0.824 rank row and printed across the label. The rank row runs to about
       0.842 and the cream footer starts at 0.864, so 0.845 is the strip
       between them — right-aligned, because the rank line fills from the
       left and the two must never meet. */
    #pvBoard .note {
      position: absolute; left: 6%; right: 6%; top: 84.5%;
      margin: 0; text-align: right;
      font: 700 2.6cqw/1 ui-monospace, Menlo, Consolas, monospace;
      color: rgba(255,214,110,0.85); text-shadow: 0 1px 2px rgba(0,0,0,0.85);
    }
    #pvBoard .note:empty { display: none; }
    #board { margin: 0; padding: 0; list-style: none; }
    #board li {
      position: absolute; left: 0; right: 0; height: 4.4cqw;
      display: flex; align-items: center;
      /* Monospace, not the panel's system-ui. His card is lettered in a
         pixel arcade face and a proportional sans over it reads as a caption
         someone stuck on top. Mono with wide tracking is the closest thing
         available without shipping a font file. */
      font: 700 4.0cqw/1 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      letter-spacing: 0.06em; font-variant-numeric: tabular-nums;
      color: #cfcabf; text-shadow: 0 0.25cqw 0 rgba(0,0,0,0.55);
    }
    #board li .r { position: absolute; left: 12.7%; }
    #board li .n {
      position: absolute; left: 28.6%; right: 13%;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #board li .s { position: absolute; right: 12.0%; }
    /* Rank one is gold in his art, and so is whoever is reading it. */
    #board li:first-child, #board li.me { color: #f0b429; }
    #lbYou {
      position: absolute; left: 0; right: 0; top: 79.5%; height: 5.2cqw;
      display: flex; align-items: center;
      font: 700 4.4cqw/1 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      letter-spacing: 0.06em; font-variant-numeric: tabular-nums;
      color: #f0b429; text-shadow: 0 0.25cqw 0 rgba(0,0,0,0.55);
    }
    #lbYou .r { position: absolute; left: 12.7%; }
    #lbYou .n { position: absolute; left: 28.6%; right: 13%;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #lbYou .s { position: absolute; right: 12.0%; }
    #lbEmpty {
      position: absolute; left: 8%; right: 8%; top: 57%; margin: 0;
      text-align: center; color: rgba(242,234,216,0.62);
      font: 600 3.4cqw/1.5 ui-monospace, Menlo, monospace; letter-spacing: 0.04em;
    }

    /* Landscape on a phone is short: shrink and tuck the pads in so they
       never eat the play area. */
    @media (orientation: landscape) and (max-height: 560px) {
      /* Lifted here too, proportionally — 10 -> 20px. Landscape has less
         height to give away than portrait, so the pair rises half as far. */
      #tL, #tR { width: 64px; height: 64px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
      #tR { left: calc(84px + env(safe-area-inset-left, 0px)); }
      #tJump { width: 78px; height: 78px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
      #tDash { width: 62px; height: 62px; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- SAFE-AREA PROBE. The canvas is full-bleed under viewport-fit=cover, so
       on a notched or Dynamic Island iPhone the top of the frame is behind
       the cutout — and the HUD was drawing its portrait, bars and pause
       button up there, under the black. Canvas has no access to env(), and
       there is no JS API for the insets, so the only way to read them is to
       let CSS resolve them onto an element and measure it. Kept 1px and
       invisible; its padding IS the measurement. -->
  <div id="safe" aria-hidden="true" style="
    position: fixed; top: 0; left: 0; width: 1px; height: 1px;
    pointer-events: none; visibility: hidden;
    padding-top: env(safe-area-inset-top, 0px);
    padding-right: env(safe-area-inset-right, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);"></div>

  <div id="touch" aria-hidden="true">
    <div class="pad move" id="tL" data-act="left">◀</div>
    <div class="pad move" id="tR" data-act="right">▶</div>
    <div class="pad" id="tDash" data-act="dash">DASH</div>
    <div class="pad" id="tJump" data-act="jump">JUMP</div>
  </div>

  <!-- ── THE PANEL: leaderboard, contest sign-up, settings ────────────────
       HTML, NOT CANVAS, and deliberately. A canvas text field means
       hand-rolling a caret, selection and an on-screen keyboard, and it gets
       none of what a real input gives you for free on a phone: the numeric
       pad for a telephone number, the @ key for an address, autofill, paste,
       and the OS scrolling the field above the keyboard. A contest whose
       sign-up form is annoying on a phone does not get filled in.

       Hidden by default and driven by src/ui/panel.js. It sits over the
       canvas but only exists while open, so it can never bleed into the
       game — same rule as the control pads. -->
  <div id="panel" hidden>
    <div id="panelCard" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
      <button id="panelClose" type="button" aria-label="Close">✕</button>
      <h2 id="panelTitle">LEADERBOARD</h2>

      <!-- ── OPTIONS IS A MENU NOW ────────────────────────────────────────
           Client, spelling out the shelf: "under options — leaderboard is
           there. Instructions could also be found under the options. The
           settings button should be found under the options, and then back
           to the game should be filed under the options."

           So OPTIONS no longer drops the player straight onto the board. The
           board is one of four things behind it, and it gets what he asked
           for twice: "the leaderboard should have his own button that says
           leaderboard." -->
      <div id="pvMenu" class="pv" hidden>
        <button class="btn" id="btnMenuBoard" type="button">LEADERBOARD</button>
        <button class="btn" id="btnMenuHow" type="button">HOW TO PLAY</button>
        <button class="btn ghost" id="btnMenuSettings" type="button">SETTINGS</button>
        <button class="btn ghost" id="btnMenuClose" type="button">BACK TO GAME</button>
      </div>

      <div id="pvHow" class="pv" hidden>
        <!-- ⚠️ EVERY PICTURE HERE IS THE REAL GAME. Client: "an image of you
             standing on it with an X next to it, an image of you jumping over
             the pothole... walking into the ninja and all your money falling
             out, and then jumping on the ninja's head... it don't have to be
             words just an image."

             tools/shoot_howto.mjs stages each moment inside a running build
             and cuts the frame the instant the game state proves it happened,
             so these are his own art, his own lighting and the actual sprite
             poses — not drawings of what the game supposedly does. The <img>
             sources are assigned in panel.js from bundler imports, because a
             literal path here resolves in dev and 404s under the Pages
             subpath. -->
        <ul id="howList">
          <li><img class="howShot" data-shot="pothole-bad" alt="" /><span class="mark bad">✕</span></li>
          <li><img class="howShot" data-shot="pothole-good" alt="" /><span class="mark good">✓</span></li>
          <li><img class="howShot" data-shot="manhole-bad" alt="" /><span class="mark bad">✕</span></li>
          <li><img class="howShot" data-shot="manhole-good" alt="" /><span class="mark good">✓</span></li>
          <li><img class="howShot" data-shot="ninja-bad" alt="" /><span class="mark bad">✕</span></li>
          <li><img class="howShot" data-shot="ninja-good" alt="" /><span class="mark good">✓</span></li>
          <li><img class="howShot" data-shot="champagne" alt="" /><span class="mark good">✓</span></li>
          <li><img class="howShot" data-shot="money" alt="" /><span class="mark good">✓</span></li>
        </ul>
        <button class="btn ghost" id="btnHowBack" type="button">BACK</button>
      </div>

      <div id="pvBoard" class="pv">
        <div id="lbCard">
          <ol id="board"></ol>
          <div id="lbYou" hidden><span class="r"></span><span class="n"></span><span class="s"></span></div>
          <p id="lbEmpty" hidden></p>
          <!-- ⚠️ THE ACTION LIVES ON THE TICKET, IN ITS OWN FOOTER.
               Client: "maybe it should be on the card at the bottom so you
               don't have to scroll it", and later, tapping through to the
               board: it "kind of feels" small. Both are the same problem —
               measured, the card was getting 68% of the screen (632px of
               932, only 292px wide) because a note, ENTER and BACK were
               stacked underneath it eating 216px.
               Only ONE of these is ever on screen (see fillBoard: ENTER
               until you are registered, SHARE after), so a single full-width
               bar is all the room the footer has to find. -->
          <p id="boardNote" class="note"></p>
          <!-- BACK JOINED THE FOOTER. It was the last thing stacked under the
               artwork, and every row under the card costs the card screen —
               that is what made the ticket 259px wide on his phone. Only one
               of ENTER / SHARE is ever on screen, so the footer always holds
               exactly two buttons. -->
          <div id="lbActions">
            <button class="btn card" id="btnRegister" type="button">ENTER THE CONTEST</button>
            <button class="btn card" id="btnShare" type="button">SHARE MY SCORE</button>
            <button class="btn card" id="btnBoardBack" type="button">BACK</button>
          </div>
        </div>
        <!-- The share sheet is the only route a web page has to Instagram or
             Facebook — see src/ui/share.js for the platform reality and the
             desktop fallback. Primary style, not ghost: posting a score is a
             thing we WANT happening, same weight as entering the contest. -->
        <!-- SETTINGS used to sit here too. It moved to the OPTIONS menu where
             the client put it, which also buys the board back a button's
             worth of height — see #lbCard on why every row under the card
             costs the artwork screen space. -->
        <!-- Client: "I need to be able to go back one level, and then from
             there back another level... how can I get out of the
             leaderboard?" That step is still here, it just moved ONTO the
             ticket's footer beside ENTER / SHARE — see #lbActions above. -->
      </div>

      <div id="pvForm" class="pv" hidden>
        <p class="note">
          All three are required. Your <b>name</b> and score go on the board.
          Your <b>phone</b> and <b>email</b> stay private — they are only how
          Will Hill's team reaches you if you win.
        </p>
        <!-- The helper text lives INSIDE each field as a placeholder as well
             as beside the label. On a phone the label scrolls out of view the
             moment the keyboard opens and the field is all you can still see,
             so a placeholder that only repeats the label wastes the one line
             the player is actually looking at. Each says what to type and, on
             the two private ones, why it is being asked for. -->
        <label>NAME <span class="req">required</span> <span class="sub">shown publicly</span>
          <input id="fName" type="text" maxlength="16" autocomplete="nickname" required
                 enterkeyhint="next" placeholder="The name on the leaderboard" />
        </label>
        <label>PHONE <span class="req">required</span> <span class="sub">private</span>
          <input id="fPhone" type="tel" inputmode="tel" maxlength="20" required
                 autocomplete="tel" enterkeyhint="next"
                 placeholder="10 digits — how we reach a winner" />
        </label>
        <label>EMAIL <span class="req">required</span> <span class="sub">private</span>
          <input id="fEmail" type="email" inputmode="email" maxlength="128" required
                 autocomplete="email" enterkeyhint="done"
                 placeholder="Backup contact, never shown" />
        </label>
        <p id="formErr" class="err" hidden></p>
        <button class="btn" id="btnSave" type="button">SAVE &amp; ENTER</button>
        <button class="btn ghost" id="btnSkip" type="button">NOT NOW</button>
      </div>

      <div id="pvSettings" class="pv" hidden>
        <!-- Two switches, not one. See setSfxEnabled in src/ui/panel.js:
             the song and the effects are separable because most people at a
             party play with the song off, and losing the song should not
             also lose the thump that says a stomp landed. -->
        <label class="row"><span>MUSIC</span>
          <input id="sSound" type="checkbox" checked /></label>
        <label class="row"><span>SOUND EFFECTS</span>
          <input id="sSfx" type="checkbox" checked /></label>
        <label class="row"><span>VIBRATION</span>
          <input id="sHaptics" type="checkbox" checked /></label>
        <p class="note" id="hapticsNote" hidden></p>
        <label class="row"><span>TIME OF DAY</span>
          <select id="sTod">
            <option value="auto">Match my clock</option>
            <option value="day">Always day</option>
            <option value="night">Always night</option>
          </select></label>
        <p class="note" id="todNote"></p>
        <button class="btn ghost" id="btnBack" type="button">BACK</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
