# THE PUBLIC GAME WORKER. Serves /top and takes /submit. Nothing here can
# read a phone number: the contact details live in the `entrants` table and
# this worker's public path never selects from it.
name = "will-hill-leaderboard"
main = "leaderboard-worker.js"
compatibility_date = "2026-08-10"

# ⚠️ D1, NOT KV — and the reason is in leaderboard-worker.js's header. The KV
# version held the whole board in ONE key and did read-modify-write with no
# compare-and-swap, so two players finishing at the same moment lost a score,
# and KV's ~1-write-per-second-per-key ceiling made a launch party a queue.
# D1 turns the whole thing into one atomic upsert.
#
# ✅ CREATED AND MIGRATED 2026-08-16. The database exists, all five tables and
# five indexes are in it, and the id below is real — nothing to do here before
# deploying. Re-running schema.sql is safe (every statement is IF NOT EXISTS)
# but unnecessary.
[[d1_databases]]
binding = "DB"
database_name = "will-hill-contest"
database_id = "980cd717-a9e1-4b63-9643-dc5ffa58be4f"
